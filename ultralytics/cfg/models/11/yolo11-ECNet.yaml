# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [1.0, 1.0, 1024]


# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [16, 3, 2]] # 0-P1/2 16x320x320 stem

  # mid_chs, out_chs, dw_kz, stride, n, alpha
  - [-1, 1, ECM, [48,32,3,2,2]] # 1 32x160x160 stage0
  - [-1, 1, ECM, [96,64,3,1,2,0.17]] # 2 64x160x160

  - [-1, 1, ECM, [96,64,3,2,2]] # 3 64x80x80 stage1
  - [-1, 1, ECM, [192,128,3,1,2,0.33]] # 4 128x80x80

  - [-1, 1, ECM, [192,128,3,2,2]] # 5 128x40x40 stage2
  - [-1, 1, ECM, [256,128,3,1,2,0.67]] # 6 128x40x40

  - [-1, 1, ECM, [384,256,3,2,2]] # 7 256x20x20 stage3
  - [-1, 1, ECM, [512,256,3,1,2,0.83]] # 8 256x20x20

  - [-1, 1, SPPF, [256, 5]] # 9 256x20x20
  - [-1, 2, C2PSA, [256]] # 10 256x20x20

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11 256x40x40
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4 384x40x40
  - [-1, 1, C3k2, [128, False]] # 13 128x40x40

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14 128x80x80
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3 256x80x80
  - [-1, 1, C3k2, [64, False]] # 16 (P3/8-small) 64x80x80

  - [-1, 1, Conv, [64, 3, 2]] # 17 64x40x40
  - [[-1, 13], 1, Concat, [1]] # cat head P4 192x40x40
  - [-1, 1, C3k2, [128, False]] # 19 (P4/16-medium) 128x40x40

  - [-1, 1, Conv, [128, 3, 2]] # 20 128x20x20
  - [[-1, 10], 1, Concat, [1]] # cat head P5 386x20x20
  - [-1, 1, C3k2, [256, True]] # 22 (P5/32-large) 256x20x20

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5) 64 128 256
